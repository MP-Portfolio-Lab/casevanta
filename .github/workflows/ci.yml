name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # AppHost builds resolve the Aspire CLI bundle (orchestrator and dashboard) from NuGet with
  # `dnx aspire.cli@<SDK version>`: pinned and signature-checked, no install script needed.
  AspireCliInvocationMode: dnxpinned
  DOTNET_NOLOGO: 'true'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$archive" gitleaks
      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore backend/Casevanta.slnx
      - name: Verify formatting
        run: |
          for project in backend/src/*/*.csproj backend/tests/*/*.csproj; do
            dotnet format "$project" --verify-no-changes --no-restore
          done
      - run: dotnet build backend/Casevanta.slnx --configuration Release --no-restore
      - name: API and security tests (suite A)
        run: dotnet test --project backend/tests/Casevanta.Api.Tests/Casevanta.Api.Tests.csproj --configuration Release --no-build
      - name: Architecture rules
        run: dotnet test --project backend/tests/Casevanta.Architecture.Tests/Casevanta.Architecture.Tests.csproj --configuration Release --no-build

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Trust the ASP.NET Core development certificate (the BFF and Keycloak serve HTTPS with it)
        run: |
          # Exit code 4 means the certificate is trusted for OpenSSL (which .NET uses on Linux) but not
          # for every other client on the runner; that is all these tests need.
          dotnet dev-certs https --trust || test $? -eq 4
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"
      - name: Distributed topology tests (suite C, Docker)
        run: dotnet test --project backend/tests/Casevanta.AppHost.Tests/Casevanta.AppHost.Tests.csproj --configuration Release

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Trust the ASP.NET Core development certificate (the BFF and Keycloak serve HTTPS with it)
        run: |
          # Exit code 4 means the certificate is trusted for OpenSSL (which .NET uses on Linux) but not
          # for every other client on the runner; that is all these tests need.
          dotnet dev-certs https --trust || test $? -eq 4
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"
      - name: Browser journeys (suite B) through the Aspire AppHost and Keycloak
        run: pnpm nx e2e staff-web-e2e --outputStyle=static
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/dist/.playwright/apps/staff-web-e2e
          retention-days: 7

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Formatting of the whole repository (Prettier)
        run: pnpm format:check
      - run: pnpm nx run-many -t lint test build
